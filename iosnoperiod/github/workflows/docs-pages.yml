name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'publication/**'
      - 'publication-manifest.json'
      - 'tools/check_publication_gate.py'
      - 'tools/test_publication_gate.py'
      - 'tools/check_workflow_parity.py'
      - 'tools/generate_publication_status.py'
      - 'tools/generate_publication_receipt.py'
      - '.github/workflows/docs-pages.yml'
      - 'iosnoperiod/github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    outputs:
      publish_root: ${{ steps.manifest.outputs.publish_root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Evaluate governed publication gate
        run: python3 tools/check_publication_gate.py

      - name: Test publication gate failures
        run: python3 tools/test_publication_gate.py

      - name: Verify workflow mirror parity
        run: python3 tools/check_workflow_parity.py

      - name: Read publish root
        id: manifest
        shell: bash
        run: |
          root="$(python3 -c 'import json; print(json.load(open("publication-manifest.json"))["publish_root"])')"
          echo "publish_root=$root" >> "$GITHUB_OUTPUT"
          echo "Governed publication root: $root" >> "$GITHUB_STEP_SUMMARY"

  publish-docs:
    needs: publication-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate governed publication status page
        run: python3 tools/generate_publication_status.py

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build governed documentation site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./${{ needs.publication-gate.outputs.publish_root }}
          destination: ./_site

      - name: Verify built site entry point
        shell: bash
        run: |
          test -f _site/index.html || {
            echo "Built Pages artifact has no _site/index.html"
            find _site -maxdepth 2 -type f -print || true
            exit 1
          }
          grep -Fq "ARA Admissibility Interop Docs" _site/index.html || {
            echo "Built Pages entry point lacks the expected site marker"
            exit 1
          }
          echo "Built Pages entry point and marker verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload governed site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy docs to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployed root
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          case "$PAGE_URL" in
            https://*) ;;
            *) echo "Deployment URL is missing or not HTTPS: $PAGE_URL"; exit 1 ;;
          esac

          expected_marker="ARA Admissibility Interop Docs"
          verified=false
          final_status=""
          final_url=""

          for attempt in $(seq 1 12); do
            probe_url="${PAGE_URL}?commit=${GITHUB_SHA}&attempt=${attempt}"
            mapfile -t curl_meta < <(
              curl --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                -o /tmp/ara-pages-root.html \
                -w '%{http_code}\n%{url_effective}\n' \
                "$probe_url" || true
            )
            final_status="${curl_meta[0]:-000}"
            final_url="${curl_meta[1]:-$probe_url}"

            if [ "$final_status" = "200" ] \
              && grep -Fq "$expected_marker" /tmp/ara-pages-root.html; then
              verified=true
              break
            fi

            echo "Live root not ready on attempt ${attempt}: status=${final_status}; retrying..."
            sleep 5
          done

          test "$verified" = true || {
            echo "Live Pages root did not return HTTP 200 with the expected rendered site marker."
            echo "Final status: $final_status"
            echo "Final URL: $final_url"
            sed -n '1,80p' /tmp/ara-pages-root.html 2>/dev/null || true
            exit 1
          }

          body_sha256="$(sha256sum /tmp/ara-pages-root.html | awk '{print $1}')"
          body_size_bytes="$(wc -c < /tmp/ara-pages-root.html | tr -d ' ')"
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "LIVE_ROOT_VERIFICATION=passed"
            echo "LIVE_ROOT_VERIFIED_AT=$verified_at"
            echo "LIVE_ROOT_HTTP_STATUS=$final_status"
            echo "LIVE_ROOT_FINAL_URL=$final_url"
            echo "LIVE_ROOT_EXPECTED_MARKER=$expected_marker"
            echo "LIVE_ROOT_MARKER_FOUND=true"
            echo "LIVE_ROOT_BODY_SHA256=$body_sha256"
            echo "LIVE_ROOT_BODY_SIZE_BYTES=$body_size_bytes"
          } >> "$GITHUB_ENV"

          echo "Live Pages root verified: $final_url" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP status: $final_status" >> "$GITHUB_STEP_SUMMARY"
          echo "Response body SHA-256: $body_sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate deployed publication status and receipt
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLICATION_ARTIFACT_ROOT: _site
          PUBLICATION_ARTIFACT_KIND: built_site
        run: |
          python3 tools/generate_publication_status.py
          python3 tools/generate_publication_receipt.py

      - name: Publish deployment summary
        run: cat docs/publication-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployed publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployed-publication-evidence
          path: |
            status/publication-status.json
            status/publication-receipt.json
            docs/publication-status.md
