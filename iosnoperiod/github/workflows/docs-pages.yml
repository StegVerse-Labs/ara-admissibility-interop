name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'publication-manifest.json'
      - 'tools/check_publication_gate.py'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    outputs:
      publish_root: ${{ steps.manifest.outputs.publish_root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Evaluate governed publication gate
        run: python3 tools/check_publication_gate.py

      - name: Read publish root
        id: manifest
        shell: bash
        run: |
          root="$(python3 -c 'import json; print(json.load(open("publication-manifest.json"))["publish_root"])')"
          echo "publish_root=$root" >> "$GITHUB_OUTPUT"
          echo "Governed publication root: $root" >> "$GITHUB_STEP_SUMMARY"

  publish-docs:
    needs: publication-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload governed docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ needs.publication-gate.outputs.publish_root }}

      - name: Deploy docs to Pages
        id: deployment
        uses: actions/deploy-pages@v4
