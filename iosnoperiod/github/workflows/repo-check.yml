name: Repo Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate validation report
        run: python3 tools/generate_validation_report.py

      - name: Publish validation summary
        run: cat status/validation-report.md >> "$GITHUB_STEP_SUMMARY"
