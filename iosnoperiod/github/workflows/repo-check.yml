name: Repo Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate validation report
        run: python3 tools/generate_validation_report.py
      - name: Check governed publication boundary
        run: python3 tools/check_publication_gate.py
      - name: Test publication gate failures
        run: python3 tools/test_publication_gate.py
      - name: Verify workflow mirror parity
        run: python3 tools/check_workflow_parity.py
      - name: Enforce workflow ceiling and discrete exceptions
        run: python3 tools/check_workflow_governance.py
      - name: Test governed docs builder
        run: python3 tools/test_governed_docs_builder.py
      - name: Generate publication status
        run: python3 tools/generate_publication_status.py
      - name: Generate publication receipt
        run: python3 tools/generate_publication_receipt.py
      - name: Test independent publication evidence verifier
        run: python3 tools/test_publication_evidence_verifier.py
      - name: Test release evidence evaluator
        run: python3 tools/test_release_evidence_evaluator.py
      - name: Test evidence bundle manifest verifier
        run: python3 tools/test_evidence_bundle_manifest.py
      - name: Test evidence-bounded release gate promotion
        run: python3 tools/test_release_gate_promotion.py
      - name: Test explicit stable-release authorization boundary
        run: python3 tools/test_stable_release_authorization.py
      - name: Test handoff-backed deployment notification
        run: python3 tools/test_deployment_notification.py
      - name: Test notification transport and monitored ingestion
        run: python3 tools/test_deployment_notification_transport.py
      - name: Test notification replay ledger
        run: python3 tools/test_deployment_notification_replay_ledger.py
      - name: Test governed mailbox poller
        run: python3 tools/test_deployment_mailbox_poller.py
      - name: Publish validation summary
        run: |
          cat status/validation-report.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat docs/publication-status.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Workflow ceiling/exception governance, deterministic docs building, publication evidence, bounded promotion, explicit stable-release authorization isolation, governed notification, replay protection, and mailbox-poller tests passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation status
        uses: actions/upload-artifact@v4
        with:
          name: generated-status
          path: status/generated-status.json
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: status/validation-report.md
      - name: Upload publication status
        uses: actions/upload-artifact@v4
        with:
          name: publication-status
          path: |
            status/publication-status.json
            docs/publication-status.md
      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipt
          path: status/publication-receipt.json

  # G17 (StegVerse-org/.github#166): folded from .github/workflows/steggate-schema-foundation.yml
  # job validate, steps carried byte for byte (verbatim record:
  # tools/tasks/folded/steggate-schema-foundation.yml, sha256 2e3aa01811ca4d84eb983ef36c0505b7976c5e530c1708c1f3abe907c113d550).
  steggate-schema-foundation:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate invariant registry, reasons, fixtures, algebra, and schema foundation
        run: python tools/lint_invariants.py
      - name: Validate stegverse.jcs.v1 canonical bytes and hashes
        run: python tools/validate_canonicalization_vectors.py
      - name: Validate achieved assurance ordering and overclaim refusal
        run: python tools/validate_assurance_fixtures.py
      - name: Validate L0-L3 external-anchor trust semantics
        run: python tools/validate_trust_levels.py
      - name: Validate content-bounded Audit Kit evidence pack
        run: |
          python tools/build_evidence_pack.py --check
          python tools/verify_evidence_pack.py --self-test
      - name: Validate first-language offline Audit Kit reconstruction
        run: python tools/verify_audit_kit.py
      - name: Validate independent Node Audit Kit reconstruction
        run: node tools/verify_audit_kit_node.mjs
      - name: Validate Track 1B cross-language canonicalizer and verifier parity
        run: node tools/validate_track1b_parity.mjs
      - name: Build deterministic fixture Audit Kit package
        run: python tools/build_audit_package.py
      - name: Verify fixture Audit Kit package and refusal paths
        run: python tools/verify_audit_package.py --self-test
      - name: Validate first real-boundary activation state
        run: python tools/validate_first_boundary_activation.py
      - name: Prove REVIEW cannot directly authorize consequence
        run: python tools/validate_review_consequence.py
      - name: Validate bounded real-boundary candidate before consequence
        run: python tools/validate_real_boundary_pilot.py
      - name: Validate deterministic execution profile and StegCore ownership boundary
        run: python tools/validate_execution_profile.py
      - name: Validate complete decision-state reconstruction semantics
        run: python tools/validate_decision_state_reconstruction.py
      - name: Validate governed-transition protocol in Python
        run: python tools/validate_governed_transition_protocol.py
      - name: Validate governed-transition protocol independently in Node
        run: node tools/validate_governed_transition_protocol_node.mjs
      - name: Validate Action-First reconstruction, observation, residual, and identifiability semantics
        run: python tools/validate_action_first_reconstruction.py
      - name: Compile and parse-check StegGate tooling
        run: |
          python -m py_compile tools/lint_invariants.py tools/canonicalize_steggate.py tools/validate_canonicalization_vectors.py tools/validate_assurance_fixtures.py tools/validate_trust_levels.py tools/build_evidence_pack.py tools/verify_evidence_pack.py tools/verify_audit_kit.py tools/build_audit_package.py tools/verify_audit_package.py tools/validate_first_boundary_activation.py tools/validate_review_consequence.py tools/validate_real_boundary_pilot.py tools/validate_execution_profile.py tools/validate_decision_state_reconstruction.py tools/validate_governed_transition_protocol.py tools/validate_action_first_reconstruction.py
          node --check tools/canonicalize_steggate_node.mjs
          node --check tools/verify_audit_kit_node.mjs
          node --check tools/validate_track1b_parity.mjs
          node --check tools/validate_governed_transition_protocol_node.mjs
      - name: Upload fixture Audit Kit package
        uses: actions/upload-artifact@v4
        with:
          name: steggate-audit-kit-fixture-001
          path: reports/audit-kit-fixture-001
          if-no-files-found: error
