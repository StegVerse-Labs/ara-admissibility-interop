name: Repo Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Assess repository files
        run: python3 tools/assess_repo.py

      - name: Validate example JSON files
        run: python3 tools/validate_examples.py

      - name: Run evaluator stub
        run: python3 admissibility/evaluator_stub.py admissibility/examples/sample-commitment-candidate.json
