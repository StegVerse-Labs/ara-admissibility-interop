  "invariants": [
    {"invariant_id":"SG-PRES-001","normative_statement":"Presentation requires an identified recipient or audience and a verified sink.","required_fixture_ids":["presentation.pp1.allow.entitled_text_sink","presentation.pp1.fail_closed.sink_unverified"],"expected_outcome":"BOUND_RECIPIENT_AND_SINK","failure_reason_code":"SINK_UNVERIFIED"},
    {"invariant_id":"SG-PRES-002","normative_statement":"Recipient authorization is evaluated independently of the actor's ability to acquire, retrieve, derive, or process the artifact.","required_fixture_ids":["presentation.pp1.deny.derived_unauthorized"],"expected_outcome":"DENY","failure_reason_code":"RECIPIENT_NOT_AUTHORIZED"},
    {"invariant_id":"SG-PRES-003","normative_statement":"A derived artifact inherits every presentation constraint of every contributing source and composes them using the profile-defined least-permissive algebra.","required_fixture_ids":["presentation.pp1.allow.composed_entitlement","presentation.pp1.deny.composition_broadening"],"expected_outcome":"LEAST_PERMISSIVE_COMPOSITION","failure_reason_code":"PRESENTATION_CONSTRAINT_BROADENING"},
    {"invariant_id":"SG-PRES-004","normative_statement":"Presentation composition operators are associative, commutative, and idempotent and never yield an envelope more permissive than any operand.","required_fixture_ids":["algebra.entitlement.associative","algebra.entitlement.commutative","algebra.entitlement.idempotent","algebra.entitlement.lower_bound"],"expected_outcome":"VALID_COMPOSITION_PROFILE","failure_reason_code":"COMPOSITION_PROFILE_INVALID"},
    {"invariant_id":"SG-PRES-005","normative_statement":"Incomparable constraint vocabularies fail closed unless an explicit signed mapping artifact is admitted.","required_fixture_ids":["presentation.pp1.fail_closed.incomparable_vocab"],"expected_outcome":"FAIL_CLOSED","failure_reason_code":"COMPOSITION_NOT_COMPARABLE"},
    {"invariant_id":"SG-PRES-006","normative_statement":"Provenance completeness propagates as the minimum completeness across the transitive closure of contributing sources.","required_fixture_ids":["presentation.pp1.fail_closed.transitive_provenance_unknown"],"expected_outcome":"TRANSITIVE_PROVENANCE","failure_reason_code":"DERIVATION_PROVENANCE_INCOMPLETE"},
    {"invariant_id":"SG-PRES-007","normative_statement":"The effective presentation envelope is recomputed at decision time from current resolvable source constraints; derivation-time hashes are audit evidence only.","required_fixture_ids":["presentation.pp1.deny.stale_derivation_entitlement","presentation.pp1.fail_closed.source_constraint_unresolvable"],"expected_outcome":"DECISION_TIME_COMPOSITION","failure_reason_code":"SOURCE_CONSTRAINT_UNRESOLVABLE"},
    {"invariant_id":"SG-PRES-008","normative_statement":"Disclosure is irreversible by default and partial disclosure is never treated as not rendered.","required_fixture_ids":["presentation.pp1.allow.rendered","presentation.pp1.deny.partial_not_not_rendered"],"expected_outcome":"IRREVERSIBLE_DISCLOSURE","failure_reason_code":"DISCLOSURE_OBSERVATION_INVALID"},
    {"invariant_id":"SG-PRES-009","normative_statement":"Writing a derived artifact to a store is a governed consequence and the store readership is evaluated as a recipient set.","required_fixture_ids":["presentation.pp1.allow.retain_restricted_store","presentation.pp1.deny.retain_broad_store"],"expected_outcome":"GOVERNED_RETENTION","failure_reason_code":"STORE_READERSHIP_TOO_BROAD"},
    {"invariant_id":"SG-PRES-010","normative_statement":"Persistence may preserve or tighten presentation constraints but may not erase provenance, reduce constraints, or broaden reachable recipients without competent authority.","required_fixture_ids":["presentation.pp1.fail_closed.store_strips_derivation"],"expected_outcome":"FAIL_CLOSED","failure_reason_code":"DERIVATION_METADATA_NOT_PRESERVABLE"},
