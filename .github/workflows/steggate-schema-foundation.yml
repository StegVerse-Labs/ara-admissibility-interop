name: StegGate Schema Foundation

on:
  pull_request:
    paths:
      - 'invariants/**'
      - 'profiles/**'
      - 'schemas/**'
      - 'algebra/**'
      - 'fixtures/**'
      - 'claims/**'
      - 'canonicalization/**'
      - 'assurance/**'
      - 'reasons/**'
      - 'tools/lint_invariants.py'
      - 'tools/canonicalize_steggate.py'
      - 'tools/validate_canonicalization_vectors.py'
      - 'tools/validate_assurance_fixtures.py'
      - 'tools/build_evidence_pack.py'
      - 'tools/verify_evidence_pack.py'
      - 'tools/verify_audit_kit.py'
      - 'management/steggate-v46-*.json'
      - 'docs/ARA_ADMISSIBILITY_INTEROP_MIRROR_HANDOFF.md'
      - '.github/workflows/steggate-schema-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate invariant registry, reasons, fixtures, algebra, and schema foundation
        run: python tools/lint_invariants.py
      - name: Validate stegverse.jcs.v1 canonical bytes and hashes
        run: python tools/validate_canonicalization_vectors.py
      - name: Validate achieved assurance ordering and overclaim refusal
        run: python tools/validate_assurance_fixtures.py
      - name: Validate content-bounded Audit Kit evidence pack
        run: |
          python tools/build_evidence_pack.py --check
          python tools/verify_evidence_pack.py --self-test
      - name: Validate offline Audit Kit receipt and evidence reconstruction
        run: python tools/verify_audit_kit.py
      - name: Compile StegGate Python tooling
        run: python -m py_compile tools/lint_invariants.py tools/canonicalize_steggate.py tools/validate_canonicalization_vectors.py tools/validate_assurance_fixtures.py tools/build_evidence_pack.py tools/verify_evidence_pack.py tools/verify_audit_kit.py
