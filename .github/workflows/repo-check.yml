name: Repo Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate validation report
        run: python3 tools/generate_validation_report.py

      - name: Check governed publication boundary
        run: python3 tools/check_publication_gate.py

      - name: Publish validation summary
        run: cat status/validation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation status
        uses: actions/upload-artifact@v4
        with:
          name: generated-status
          path: status/generated-status.json

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: status/validation-report.md
